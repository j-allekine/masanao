name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      DISABLE_ERD: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Type-check
        run: pnpm exec next typegen && pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test architecture boundaries
        run: pnpm test:architecture

      - name: Run tests
        run: pnpm test:run -- --passWithNoTests

      - name: Build application
        run: pnpm build

  native-windows:
    runs-on: windows-latest
    env:
      DATABASE_URL: file:./ci-windows.db
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out fresh repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          architecture: x64
          cache: pnpm

      - name: Verify Windows x64 runtime
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Expected a Windows x64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
          node --version
          pnpm --version

      - name: Install dependencies with repository lifecycle policy
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client for native runtime test
        run: pnpm exec prisma generate --generator client

      - name: Run native SQLite runtime smoke test
        run: pnpm exec vitest run tests/native-sqlite-runtime.test.ts --reporter=verbose

  production-runtime:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci-production.db
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out fresh repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          architecture: x64
          cache: pnpm

      - name: Install full dependency graph
        run: pnpm install --frozen-lockfile

      - name: Generate application Prisma Client
        run: pnpm exec prisma generate --generator client --config prisma7.config.ts

      - name: Prune to production dependencies
        run: pnpm install --prod --frozen-lockfile

      - name: Verify production SQLite runtime
        run: pnpm run verify:production-sqlite
